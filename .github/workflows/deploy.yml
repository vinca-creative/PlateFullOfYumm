name: Deploy development and production sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep the build and both ordered deployments in one non-canceling release lane.
concurrency:
  group: static-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PFOY_WORDPRESS_API_ROOT: ${{ vars.PFOY_WORDPRESS_API_ROOT }}
      PFOY_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
      PFOY_CMS_ORIGIN: ${{ vars.PFOY_CMS_ORIGIN }}
      VITE_CMS_ORIGIN: ${{ vars.PFOY_CMS_ORIGIN }}
      VITE_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Check out main source
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          clean: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.17.0
          cache: npm
      - name: Require public content configuration
        run: |
          for name in PFOY_WORDPRESS_API_ROOT PFOY_PUBLIC_SITE_ORIGIN PFOY_CMS_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required public content configuration is missing: $name."
              exit 1
            fi
          done
      - name: Start with clean generated output
        run: rm -rf build content-snapshot .svelte-kit release-artifact
      - run: npm ci
      - name: Fetch complete current public WordPress snapshot
        run: npm run content:snapshot
      - name: Preserve content snapshot for Pages URL transformation
        run: cp -a content-snapshot "$RUNNER_TEMP/production-content-snapshot"
      - name: Transform snapshot for GitHub Pages origin
        run: node --experimental-strip-types scripts/transform-snapshot-origin.ts "$PFOY_PUBLIC_SITE_ORIGIN" "$PAGES_ORIGIN" "$PAGES_BASE_PATH"
      - name: Build GitHub Pages development site
        env:
          VITE_PUBLIC_SITE_ORIGIN: ${{ format('https://{0}.github.io', github.repository_owner) }}
          VITE_ADS_ENABLED: 'false'
          VITE_ADS_PUBLISHER_ID: ca-pub-3611846975019947
          VITE_ADS_FIRST_SLOT: '9535700852'
          VITE_ADS_CMP_URL: ${{ vars.PFOY_ADS_CMP_URL }}
          VITE_ADS_PRIVACY_URL: ${{ vars.PFOY_ADS_PRIVACY_URL }}
          VITE_ADS_SELLER_LINE: ${{ vars.PFOY_ADS_SELLER_LINE }}
          PFOY_GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Audit GitHub Pages static artifact
        run: |
          mkdir -p release-artifact
          node --experimental-strip-types scripts/static-artifact-audit.ts build content-snapshot/snapshot.json "$PAGES_BASE_PATH" release-artifact/pages-route-asset-manifest.json
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
          retention-days: 7
      - name: Restore the validated public snapshot
        run: |
          rm -rf content-snapshot
          cp -a "$RUNNER_TEMP/production-content-snapshot" content-snapshot
      - name: Build root-path Cloudflare site
        env:
          VITE_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
          VITE_ADS_ENABLED: 'false'
          VITE_ADS_PUBLISHER_ID: ca-pub-3611846975019947
          VITE_ADS_FIRST_SLOT: '9535700852'
          VITE_ADS_CMP_URL: ${{ vars.PFOY_ADS_CMP_URL }}
          VITE_ADS_PRIVACY_URL: ${{ vars.PFOY_ADS_PRIVACY_URL }}
          VITE_ADS_SELLER_LINE: ${{ vars.PFOY_ADS_SELLER_LINE }}
          PFOY_GITHUB_PAGES_BASE_PATH: ''
        run: |
          rm -rf build .svelte-kit
          npm run build
          node --experimental-strip-types scripts/write-media-redirects.ts
          cp .github/workflows/_headers build/_headers
          node --experimental-strip-types scripts/static-artifact-audit.ts build content-snapshot/snapshot.json '' release-artifact/cloudflare-route-asset-manifest.json
          mkdir -p release-artifact
          cp -a build release-artifact/build
      - name: Upload complete production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    needs: build-release
    if: needs.build-release.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages development artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check out Pages home-page verifier
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          clean: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.17.0
      - name: Check deployed GitHub Pages home page
        env:
          PAGES_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/pages-deployment-smoke.mjs

  deploy-prod:
    needs: [build-release, deploy-dev]
    if: needs.build-release.result == 'success' && needs.deploy-dev.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
    env:
      PFOY_WORDPRESS_API_ROOT: ${{ vars.PFOY_WORDPRESS_API_ROOT }}
      PFOY_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
      PFOY_CMS_ORIGIN: ${{ vars.PFOY_CMS_ORIGIN }}
      PFOY_DEPLOYMENT_TARGET: ${{ vars.PFOY_DEPLOYMENT_TARGET || 'workers' }}
      PFOY_PAGES_PROJECT_NAME: ${{ vars.PFOY_PAGES_PROJECT_NAME }}
      PFOY_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          clean: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.17.0
      - name: Download this run's production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
      - name: Restore production artifact
        run: cp -a release-artifact/build build
      - name: Require supported Cloudflare deployment target
        run: |
          case "$PFOY_DEPLOYMENT_TARGET" in
            workers|pages) ;;
            *) echo "::error::PFOY_DEPLOYMENT_TARGET must be workers or pages."; exit 1 ;;
          esac
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PFOY_CREDENTIAL_ERROR: Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
        run: bash scripts/deploy-require-cloudflare.sh
      - name: Require Pages project configuration for selected fallback
        if: env.PFOY_DEPLOYMENT_TARGET == 'pages'
        env:
          PFOY_PAGES_PROJECT_NAME: ${{ vars.PFOY_PAGES_PROJECT_NAME }}
        run: bash scripts/deploy-require-pages-project.sh
      - name: Require Pages project and domain preflight
        if: env.PFOY_DEPLOYMENT_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PFOY_PAGES_PROJECT_NAME: ${{ vars.PFOY_PAGES_PROJECT_NAME }}
          PFOY_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
        run: bash scripts/deploy-pages-preflight.sh
      - name: Deploy complete artifact to Workers Static Assets
        if: env.PFOY_DEPLOYMENT_TARGET == 'workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-workers.sh
      - name: Deploy complete artifact to Cloudflare Pages Direct Upload fallback
        if: env.PFOY_DEPLOYMENT_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PFOY_PAGES_PROJECT_NAME: ${{ vars.PFOY_PAGES_PROJECT_NAME }}
          PFOY_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-pages.sh
      - name: Confirm Pages production deployment identity
        if: env.PFOY_DEPLOYMENT_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PFOY_PAGES_PROJECT_NAME: ${{ vars.PFOY_PAGES_PROJECT_NAME }}
          PFOY_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-pages-verify.sh
      - name: Check deployed production home page
        env:
          PFOY_PUBLIC_SITE_ORIGIN: ${{ vars.PFOY_PUBLIC_SITE_ORIGIN }}
        run: node --experimental-strip-types scripts/publication.ts smoke
